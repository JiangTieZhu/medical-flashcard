<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中医方剂学 · 执业医师闪卡</title>
<link rel="stylesheet" href="style.css?v=20261119-1">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>中医方剂学</h1>
      <p class="sub">执业医师考试闪卡 · <span id="total">0</span> 首方剂</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="toolbar">
    <input id="q" type="search" placeholder="搜索方名 / 药物 / 主治…" autocomplete="off">
    <select id="chapter"><option value="全部">全部章节</option></select>
    <select id="level">
      <option value="全部">全部级别</option>
      <option value="重点">重点</option>
      <option value="次重点">次重点</option>
      <option value="了解">了解</option>
    </select>
    <select id="mode">
      <option value="顺序">顺序</option>
      <option value="乱序">乱序</option>
    </select>
    <label class="chk"><input id="hide" type="checkbox"> 隐藏已掌握</label>
    <label class="chk" title="先只看方名回忆，点击方歌位置显示"><input id="mute" type="checkbox"> 先藏方歌</label>
  </section>

  <main class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="点击翻面">
      <div class="inner">
        <div class="face front">
          <div class="badge" id="f-level">重点</div>
          <div class="chap" id="f-chap"></div>
          <h2 class="name" id="f-name"></h2>
          <div class="src" id="f-src"></div>
          <div class="song" id="f-song"></div>
          <div class="hint">点击卡片或按空格翻面</div>
        </div>
        <div class="face back" id="b-body"></div>
      </div>
    </div>
  </main>

  <section class="controls">
    <button id="prev" class="btn ghost">← 上一张</button>
    <button id="flip" class="btn primary">翻面</button>
    <button id="next" class="btn ghost">下一张 →</button>
    <button id="master" class="btn ok">标记已掌握</button>
  </section>

  <div class="progress">
    <div class="bar"><i id="bar"></i></div>
    <div class="meta"><span id="pos"></span><span id="mastered"></span></div>
  </div>

  <footer class="foot">
    <span>快捷键：空格 翻面 · ←/→ 切换 · M 标记掌握</span>
    <button id="reset" class="link">清空掌握记录</button>
  </footer>
</div>

<script src="formulas.js?v=20261119-1"></script>
<script src="app.js?v=20261119-1"></script>
</body>
</html>
